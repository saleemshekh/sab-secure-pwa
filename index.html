<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAB Secure - SAMA Compliant v21</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0f172a; font-family:'Tajawal',sans-serif}
  #location{height:32px; line-height:32px; overflow:hidden; white-space:nowrap; direction:ltr!important; font-family:'JetBrains Mono',monospace}
  #country{min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.3; padding:6px 12px}
  #acc{height:24px; line-height:24px; overflow:hidden; direction:ltr!important; font-family:'JetBrains Mono',monospace}
  #status{height:92px; display:flex; align-items:center; justify-content:center; text-align:center}
</style>
</head>
<body class="bg-[#0f172a] min-h-screen flex justify-center p-3">
<div class="bg-white rounded-[28px] w-full max-w-[390px] p-5 shadow-2xl">
  <div class="flex gap-2 mb-3">
    <button id="btnEn" onclick="setLang('en')" class="text-xs px-5 py-2 rounded-full bg-black text-white font-black">EN</button>
    <button id="btnAr" onclick="setLang('ar')" class="text-xs px-5 py-2 rounded-full bg-gray-200 text-black font-black border">العربية</button>
  </div>
  <div class="text-center mb-5">
    <div class="w-20 h-20 bg-black rounded-full mx-auto flex items-center justify-center text-4xl">📍</div>
    <h1 id="title" class="text-[20px] font-black text-black mt-3">SAB - Saudi First Bank</h1>
    <p id="sub" class="text-[12px] font-bold text-black">Verification of the site is compatible with SAMA.</p>
    <span class="inline-block mt-2 bg-green-200 text-black text-[11px] px-3 py-1 rounded-full font-black border border-green-700">● PWA Active - v21 STABLE</span>
  </div>
  <div class="bg-gray-100 rounded-2xl border-2 border-gray-300 p-4 mb-4">
    <div class="flex justify-between items-center h-[26px]">
      <span id="locLabel" class="text-[11px] font-black text-black">User site</span>
      <span class="text-[10px] bg-green-300 text-black px-3 py-1 rounded-full font-black border border-green-800">● LIVE - STABLE</span>
    </div>
    <p id="location" dir="ltr" class="text-[18px] font-black text-black mt-3 text-center">--.------, --.------</p>
    <div class="flex justify-center mt-2"><p id="country" class="text-[12px] font-black bg-yellow-200 border-2 border-black rounded-full px-4 py-2 max-w-full">📍 Detecting...</p></div>
    <p id="acc" dir="ltr" class="text-[11px] font-bold text-black mt-2 text-center">Accuracy: --m - Alt: --m</p>
    <div id="status" class="mt-3 text-[12px] font-black p-3 rounded-xl bg-gray-200 text-black border-2 border-gray-400">Checking location...</div>
  </div>
  <div class="bg-gray-100 rounded-2xl border-2 border-gray-300 p-4 mb-4">
    <label id="verLabel" class="text-[11px] font-black text-black block mb-2">VERIFICATION</label>
    <div dir="ltr" class="grid grid-cols-[1fr_90px] gap-2 w-full">
      <input id="otp" placeholder="Enter OTP" class="w-full border-2 border-black rounded-xl px-3 py-3 text-[14px] font-bold bg-white text-black outline-none">
      <button id="vBtn" onclick="verify()" class="w-full bg-black text-white rounded-xl font-black text-[14px] h-[48px]">Verify</button>
    </div>
  </div>
  <button id="mainBtn" class="w-full bg-black text-white py-4 rounded-2xl font-black text-[14px] h-[56px]">Checking...</button>
</div>

<script>
let lang='en', lastLat=null, lastLon=null, lockedPlace=null, lockedCoords=null;
const T={
 en:{title:"SAB - Saudi First Bank", sub:"Verification of the site is compatible with SAMA.", loc:"User site", ver:"VERIFICATION", otp:"Enter OTP", btn:"Verify", clean:"✅ Within the Kingdom - Compliant with SAMA - 100% Risk - Clean Site", mock:"⚠️ Fake Location Detected - Risk 960 - BLOCKED", safe:"✅ Safe follow-up - Allowed", block:"🚫 BLOCKED - Risk 960"},
 ar:{title:"SAB - البنك السعودي الأول", sub:"التحقق من الموقع متوافق مع SAMA", loc:"موقع المستخدم", ver:"التحقق", otp:"أدخل رمز التحقق", btn:"تحقق", clean:"✅ داخل المملكة - متوافق مع SAMA - خطر 100 - موقع نظيف", mock:"⚠️ تم اكتشاف موقع وهمي - خطر 960 - محظور", safe:"✅ متابعة آمنة - مسموح", block:"🚫 محظور - خطر 960"}
};
function setLang(l){
  lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.getElementById('btnEn').className=l==='en'?"text-xs px-5 py-2 rounded-full bg-black text-white font-black":"text-xs px-5 py-2 rounded-full bg-gray-200 text-black font-black border";
  document.getElementById('btnAr').className=l==='ar'?"text-xs px-5 py-2 rounded-full bg-black text-white font-black":"text-xs px-5 py-2 rounded-full bg-gray-200 text-black font-black border";
  document.getElementById('title').innerText=T[l].title; document.getElementById('sub').innerText=T[l].sub; document.getElementById('locLabel').innerText=T[l].loc; document.getElementById('verLabel').innerText=T[l].ver; document.getElementById('otp').placeholder=T[l].otp; document.getElementById('vBtn').innerText=T[l].btn;
  if(lockedPlace) document.getElementById('country').innerText=lockedPlace;
}
function getFallback(lat,lon){
  // KSA check
  if(lat>16 && lat<33 && lon>34 && lon<56){
    if(lat>=24 && lat<=25 && lon>=46 && lon<=47) return lang==='ar'? "🇸🇦 الرياض، المملكة العربية السعودية - داخل المملكة" : "🇸🇦 Riyadh, Saudi Arabia - Within KSA";
    return lang==='ar'? "🇸🇦 المملكة العربية السعودية - داخل المملكة" : "🇸🇦 Saudi Arabia - Within KSA";
  }
  if(lat>=26.5 && lat<=27.8 && lon>=76.2 && lon<=77.5) return lang==='ar'? "🇮🇳 ألوار، راجستان، الهند - خارج المملكة" : "🇮🇳 Alwar, Rajasthan, India - Outside KSA";
  if(lat>=8 && lat<=37 && lon>=68 && lon<=97.5) return lang==='ar'? "🇮🇳 الهند - خارج المملكة" : "🇮🇳 India - Outside KSA";
  if(lat>=1.6 && lat<=13.2 && lon>=8.2 && lon<=16.5) return lang==='ar'? "🇨🇲 الكاميرون - خارج المملكة" : "🇨🇲 Cameroon - Outside KSA";
  return lang==='ar'? `🌍 خارج المملكة - ${lat.toFixed(2)}, ${lon.toFixed(2)}` : `🌍 Outside KSA - ${lat.toFixed(2)}, ${lon.toFixed(2)}`;
}
async function fetchDynamic(lat,lon){
  try{
    const c=new AbortController(); setTimeout(()=>c.abort(),4000);
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`,{signal:c.signal, cache:'no-store'});
    const d=await r.json(); if(!d.countryName) return null;
    let flag="🌍"; if(d.countryCode){ try{ flag=String.fromCodePoint(...d.countryCode.toUpperCase().split('').map(x=>127397+x.charCodeAt())) }catch{} }
    const city=d.city||d.locality||d.principalSubdivision||"";
    const isKSA = d.countryCode==='SA' || d.countryName==='Saudi Arabia';
    if(isKSA){
      return lang==='ar'? `${flag} ${city?city+'، ':''}${d.countryName} - داخل المملكة` : `${flag} ${city?city+', ':''}${d.countryName} - Within KSA`;
    } else {
      return lang==='ar'? `${flag} ${city?city+'، ':''}${d.countryName} - خارج المملكة` : `${flag} ${city?city+', ':''}${d.countryName} - Outside KSA`;
    }
  }catch{ return null; }
}
async function render(d){
  // STABLE - same location pe dobara mat karo
  if(lastLat!==null && Math.abs(d.lat-lastLat)<0.00005 && Math.abs(d.lon-lastLon)<0.00005) return;
  lastLat=d.lat; lastLon=d.lon;

  document.getElementById('location').innerText=d.lat.toFixed(6)+", "+d.lon.toFixed(6);
  document.getElementById('acc').innerText=lang==='ar'?`الدقة: ${Math.round(d.acc)}m - Alt: ${(d.alt!==null?d.alt.toFixed(1):"0")}m`:`Accuracy: ${Math.round(d.acc)}m - Alt: ${(d.alt!==null?d.alt.toFixed(1):"0")}m`;

  let s=document.getElementById('status'), b=document.getElementById('mainBtn');
  if(d.block){ s.innerText=T[lang].mock; s.className="mt-3 text-[12px] font-black p-3 rounded-xl bg-red-200 text-black border-2 border-red-700 flex items-center justify-center text-center"; b.innerText=T[lang].block; b.className="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[14px] h-[56px]"; }
  else { s.innerText=T[lang].clean; s.className="mt-3 text-[12px] font-black p-3 rounded-xl bg-green-200 text-black border-2 border-green-700 flex items-center justify-center text-center"; b.innerText=T[lang].safe; b.className="w-full bg-black text-white py-4 rounded-2xl font-black text-[14px] h-[56px]"; }

  // LOCK - ek baar aaya to overwrite nahi
  if(!lockedPlace ||!lockedCoords || Math.abs(lockedCoords.lat-d.lat)>0.001 || Math.abs(lockedCoords.lon-d.lon)>0.001){
    lockedPlace = getFallback(d.lat,d.lon);
    lockedCoords = {lat:d.lat, lon:d.lon};
    document.getElementById('country').innerText = lockedPlace;
    const dyn = await fetchDynamic(d.lat,d.lon);
    if(dyn){ lockedPlace = dyn; document.getElementById('country').innerText = dyn; }
  } else {
    document.getElementById('country').innerText = lockedPlace;
  }
}
function check(p){
  let lat=p.coords.latitude, lon=p.coords.longitude, acc=p.coords.accuracy, alt=p.coords.altitude;
  let inSaudi=lat>16&&lat<33&&lon>34&&lon<56; let isMock=false;
  if((alt===0||alt===null)&&acc<2) isMock=true; // ab 0m pe hi fake, 8m real ko allow
  if(acc===0) isMock=true;
  render({lat,lon,acc,alt,block:isMock||!inSaudi});
}
function verify(){ let v=document.getElementById('otp').value; alert(v.length>=4?(lang==='ar'?"✅ تم التحقق":"✅ Verified - "+v):"Enter OTP"); }
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
navigator.geolocation.getCurrentPosition(check, e=>{ document.getElementById('status').innerText="Enable Location"; }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
setLang('en');
</script>
</body>
</html>
