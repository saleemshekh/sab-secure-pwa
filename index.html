<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.blocked { background:#ffcccc; color:#990000; border:2px solid red; }
.disabled { pointer-events:none; opacity:0.4; }
</style>
</head>
<body>

<script>
// ===== v65 GLOBAL SECURITY GUARD =====
let lastLat = 0, lastLon = 0, lastAcc = 999, isFake = false, isInsideKSA = false;
let riskScore = 0;
let currentCity = "";

function checkSecurity(lat, lon, acc) {
  lastLat = lat; lastLon = lon; lastAcc = acc;
  
  // Fake detection
  isFake = (acc === 0 || acc < 3); // 0m = 100% fake
  
  // KSA Bounding Box: 16-33 lat, 34-56 lon
  isInsideKSA = (lat >= 16 && lat <= 33 && lon >= 34 && lon <= 56 && !isFake && acc > 3);
  
  // Risk
  riskScore = isInsideKSA ? 0 : 960;
  
  return { isFake, isInsideKSA, riskScore };
}

// ===== S1 → S2 Guard =====
function goToS2() {
  const sec = checkSecurity(lastLat, lastLon, lastAcc);
  
  if (!sec.isInsideKSA || sec.isFake || sec.riskScore == 960) {
    // Fake pe bhi S2 dikhao lekin blocked state me
    showS2Blocked();
    return;
  }
  showS2Normal();
}

// ===== S2 → S3 CRITICAL GUARD - v65 FIX =====
function go3() {
  const sec = checkSecurity(lastLat, lastLon, lastAcc);
  
  // 🔴 FINAL BLOCK - Dashboard pe jaane se pehle
  if (!sec.isInsideKSA || sec.isFake || sec.riskScore == 960 || lastAcc == 0) {
    alert("🚫 HIGH RISK - BLOCKED - Risk 960 - 🌍 " + currentCity + " - Outside KSA - Risk 960");
    // Dashboard mat kholo, wapis S1 pe
    location.reload();
    return false;
  }
  
  // 🟢 Only Riyadh allowed
  showS3Secure();
}

function showS3Secure() {
  const sec = checkSecurity(lastLat, lastLon, lastAcc);
  
  // Double check inside S3 also - Agar bypass karke aaya to
  if (!sec.isInsideKSA || sec.isFake) {
    document.body.innerHTML = `
      <div style="padding:20px; text-align:center; margin-top:100px;">
        <h1 style="color:red;">🚫 HIGH RISK - BLOCKED</h1>
        <p>🌍 ${currentCity} - Outside KSA - Risk 960</p>
        <p>📍 ${lastLat}, ${lastLon}</p>
        <p>Accuracy: ${lastAcc}m - Fake GPS ON</p>
        <button onclick="location.reload()" style="padding:15px 30px; background:black; color:white; border-radius:10px;">Back to Safety Check</button>
      </div>
    `;
    return;
  }
  
  // Normal Dashboard - Only for Riyadh
  document.getElementById('s3').innerHTML = `
    <div>Account Verified</div>
    <div>SAR 125,450.00</div>
    <div>🇸🇦 Riyadh, Within KSA - Safe</div>
    <button>Transfer Now →</button>
  `;
}

function showS2Blocked() {
  // S2 pe blocked UI
  document.getElementById('verifyBtn').innerHTML = "🚫 HIGH RISK - BLOCKED - Risk 960";
  document.getElementById('verifyBtn').style.background = "#ffcccc";
  document.getElementById('verifyBtn').style.color = "#990000";
  document.getElementById('verifyBtn').onclick = function() {
    alert("🚫 HIGH RISK - BLOCKED - Risk 960 - 🌍 " + currentCity + " - Outside KSA - Risk 960");
  };
}

// GPS Update with live check
function onGPSUpdate(lat, lon, acc, city) {
  currentCity = city;
  const sec = checkSecurity(lat, lon, acc);
  
  // Agar already S3 pe hai aur fake on hua to auto kick
  if (document.getElementById('s3').style.display != 'none') {
    if (!sec.isInsideKSA) {
      alert("🚨 Location changed to Outside KSA - Session Blocked - Risk 960");
      location.reload();
    }
  }
}
</script>

<!-- SCREENS -->
<div id="s1">S1 SAMA Notice - Live #</div>
<div id="s2" style="display:none;">
  <button id="verifyBtn" onclick="go3()">Verify</button>
</div>
<div id="s3" style="display:none;">Account Verified SAR 125,450</div>

</body>
</html>
