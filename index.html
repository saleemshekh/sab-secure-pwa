<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAB Secure - SAMA Compliant</title>

<!-- PWA Tags - Merged -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/484/484167.png">

<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

<div class="bg-white text-gray-900 rounded-3xl shadow-2xl w-full max-w-md p-6">
  <!-- Logo -->
  <div class="text-center mb-6">
    <img src="https://cdn-icons-png.flaticon.com/512/484/484167.png" class="w-16 h-16 mx-auto mb-3">
    <h1 class="text-2xl font-bold text-[#0f172a]">SAB Secure</h1>
    <p class="text-sm text-gray-500">SAMA Compliant Location Verification</p>
    <span class="inline-block mt-2 bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full">● PWA Active - Install Ready</span>
  </div>

  <!-- SAMA Card -->
  <div class="space-y-4">
    <div class="bg-gray-50 p-4 rounded-xl">
      <label class="text-xs font-bold text-gray-500">USER LOCATION</label>
      <p id="location" class="font-mono text-sm mt-1">Fetching GPS...</p>
      <p id="status" class="text-xs mt-2 text-blue-600">Checking SAMA Geofence...</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-xl">
      <label class="text-xs font-bold text-gray-500">VERIFICATION</label>
      <div class="flex gap-2 mt-2">
        <input id="otp" type="text" placeholder="Enter OTP" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none">
        <button onclick="verify()" class="bg-[#0f172a] text-white px-5 py-2 rounded-lg text-sm font-bold">Verify</button>
      </div>
    </div>

    <button onclick="getLocation()" class="w-full bg-[#0f172a] text-white py-3 rounded-xl font-bold">📍 Verify My Location (SAMA)</button>
    <p class="text-[10px] text-center text-gray-400">Complies with SAMA CSF & NCA ECC-1:2018<br>Data stays inside KSA - No external API</p>
  </div>
</div>

<script>
// SAMA Secure Location Logic
function getLocation(){
  const locEl = document.getElementById('location');
  const statusEl = document.getElementById('status');
  if(!navigator.geolocation){
    locEl.innerText = "Geolocation not supported";
    return;
  }
  locEl.innerText = "Locating... (Secure)";
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude.toFixed(6);
    const lng = pos.coords.longitude.toFixed(6);
    locEl.innerText = lat + ", " + lng;
    // Simple KSA Geofence Check (16-32 Lat, 34-56 Lng approx)
    if(lat>16 && lat<32 && lng>34 && lng<56){
      statusEl.innerText = "✅ Inside KSA - SAMA Compliant";
      statusEl.className = "text-xs mt-2 text-green-600 font-bold";
    } else {
      statusEl.innerText = "❌ Outside KSA - Blocked per SAMA";
      statusEl.className = "text-xs mt-2 text-red-600 font-bold";
    }
  }, err => {
    locEl.innerText = "Location Error: Enable GPS";
  }, {enableHighAccuracy:true});
}
function verify(){
  const otp = document.getElementById('otp').value;
  if(otp.length==6){ alert("✅ Verified - SAMA Log Saved"); }
  else { alert("Enter 6-digit OTP"); }
}
getLocation();

// PWA Service Worker - Merged
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>console.log("PWA Ready!"));
}
</script>
</body>
</html>
