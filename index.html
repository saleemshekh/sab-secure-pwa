<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SAB Secure</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0f172a}
  #status{min-height:84px; display:flex; align-items:center; justify-content:center; text-align:center;}
  #location{min-height:28px}
  #countryBox{min-height:38px; display:flex; align-items:center; justify-content:center;}
  #accText{min-height:20px}
</style>
</head>
<body class="bg-[#0f172a] min-h-screen flex justify-center p-3">
<div class="bg-white rounded-[28px] w-full max-w-[390px] p-5 shadow-2xl overflow-hidden">
  <div class="flex justify-end gap-2 mb-3">
    <button id="btnAr" onclick="setLang('ar')" class="text-xs px-4 py-2 rounded-full bg-black text-white font-black">العربية</button>
    <button id="btnEn" onclick="setLang('en')" class="text-xs px-4 py-2 rounded-full bg-gray-200 text-black font-black border">EN</button>
  </div>
  <div class="text-center mb-5">
    <div class="w-20 h-20 bg-black rounded-full mx-auto flex items-center justify-center text-4xl">📍</div>
    <h1 id="title" class="text-[22px] font-black text-black mt-3">SAB - البنك السعودي الأول</h1>
    <p id="subTitle" class="text-[13px] font-bold text-black">التحقق من الموقع متوافق مع SAMA</p>
    <span class="inline-block mt-2 bg-green-200 text-black text-[11px] px-3 py-1 rounded-full font-black border border-green-700">● PWA Active - Install Ready</span>
  </div>
  <div class="bg-gray-100 rounded-2xl border-2 border-gray-300 p-4 mb-4">
    <div class="flex justify-between items-center">
      <span id="liveTag" class="text-[10px] bg-green-300 text-black px-3 py-1 rounded-full font-black border border-green-800">● LIVE AUTO - 5s</span>
      <span id="locLabel" class="text-[12px] font-black text-black">موقع المستخدم</span>
    </div>
    <p id="location" class="text-[18px] font-black text-black mt-3 font-mono text-center">جاري التحميل...</p>
    <div id="countryBox" class="mt-2">
      <p id="countryName" class="text-[13px] font-black text-black bg-yellow-200 border-2 border-black rounded-full px-4 py-1.5">📍 جاري الكشف عن الدولة...</p>
    </div>
    <p id="accText" class="text-[12px] font-bold text-black mt-2 font-mono text-center">الدقة: --</p>
    <div id="status" class="mt-3 text-[13px] font-black p-3 rounded-xl bg-gray-200 text-black border-2 border-gray-400 text-center leading-6">فحص الموقع...</div>
  </div>
  <div class="bg-gray-100 rounded-2xl border-2 border-gray-300 p-4 mb-4">
    <label class="text-[12px] font-black text-black block mb-2">VERIFICATION</label>
    <div class="grid grid-cols-[1fr_90px] gap-2 w-full">
      <input id="otp" type="text" placeholder="Enter OTP" class="w-full border-2 border-black rounded-xl px-3 py-3 text-[14px] font-bold text-black bg-white outline-none min-w-0">
      <button onclick="verify()" class="w-full bg-black text-white rounded-xl text-[14px] font-black py-3">Verify</button>
    </div>
  </div>
  <button id="mainBtn" class="w-full bg-black text-white py-4 rounded-2xl font-black text-[15px]">🔍 فحص جاري...</button>
  <p id="samaTxt" class="text-[10px] text-center text-black font-bold mt-3 leading-tight">متوافقة مع SAMA CSF و NCA ECC-1:2018<br>البيانات داخل المملكة</p>
</div>
<script>
let currentLang='ar', lastLat=null, lastLon=null, lastAcc=null, lastRender=0;
const T={
 en:{title:"SAB - Saudi Awwal Bank",sub:"SAMA Compliant Location Verification",loc:"USER LOCATION",acc:"Accuracy",clean:"✅ Inside KSA - SAMA Compliant - Risk 100 - Clean Location",mock:"⚠️ Fake Location Detected - Risk 960 - BLOCKED",safe:"✅ Safe follow-up - Allowed",block:"🚫 BLOCKED - Risk 960",sama:"Complies with SAMA CSF & NCA ECC-1:2018<br>Data stays inside KSA",otp:"Enter OTP"},
 ar:{title:"SAB - البنك السعودي الأول",sub:"التحقق من الموقع متوافق مع SAMA",loc:"موقع المستخدم",acc:"الدقة",clean:"✅ داخل المملكة - متوافق مع SAMA - خطر 100 - موقع نظيف",mock:"⚠️ تم اكتشاف موقع وهمي - خطر 960 - محظور",safe:"✅ متابعة آمنة - مسموح",block:"🚫 محظور - خطر 960",sama:"متوافقة مع SAMA CSF و NCA ECC-1:2018<br>البيانات داخل المملكة",otp:"Enter OTP"}
};
function getCountry(lat,lon){
  if(lat>=16 && lat<=33 && lon>=34 && lon<=56) return {en:"🇸🇦 Saudi Arabia", ar:"🇸🇦 المملكة العربية السعودية"};
  if(lat>=4 && lat<=14 && lon>=2 && lon<=15) return {en:"🇳🇬 Nigeria / Cameroon", ar:"🇳🇬 نيجيريا / الكاميرون"};
  return {en:"🌍 Outside KSA", ar:"🌍 خارج المملكة"};
}
function setLang(l){
 currentLang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.getElementById('btnEn').className=l==='en'?"text-xs px-4 py-2 rounded-full bg-black text-white font-black":"text-xs px-4 py-2 rounded-full bg-gray-200 text-black font-black border";
 document.getElementById('btnAr').className=l==='ar'?"text-xs px-4 py-2 rounded-full bg-black text-white font-black":"text-xs px-4 py-2 rounded-full bg-gray-200 text-black font-black border";
 document.getElementById('title').innerText=T[l].title; document.getElementById('subTitle').innerText=T[l].sub; document.getElementById('locLabel').innerText=T[l].loc; document.getElementById('samaTxt').innerHTML=T[l].sama; document.getElementById('otp').placeholder=T[l].otp;
 if(window.lastData) render(window.lastData,true);
}
function render(d,force=false){
  window.lastData=d;
  if(!force){ if(d.lat===lastLat && d.lon===lastLon && d.acc===lastAcc) return; if(Date.now()-lastRender < 4000) return; }
  lastRender=Date.now(); lastLat=d.lat; lastLon=d.lon; lastAcc=d.acc;
  document.getElementById('location').innerText=d.lat.toFixed(6)+", "+d.lon.toFixed(6);
  let c=getCountry(d.lat,d.lon); document.getElementById('countryName').innerText=currentLang==='ar'?c.ar:c.en;
  document.getElementById('accText').innerText=(currentLang==='ar'?T.ar.acc:T.en.acc)+": "+Math.round(d.acc)+"m - Alt: "+(d.alt?d.alt.toFixed(1):"0")+"m - "+new Date().toLocaleTimeString();
  let s=document.getElementById('status'), b=document.getElementById('mainBtn');
  if(d.isBlocked){ s.innerText=T[currentLang].mock; s.className="mt-3 text-[13px] font-black p-3 rounded-xl bg-red-200 text-black border-2 border-red-700 text-center leading-6"; b.innerText=T[currentLang].block; b.className="w-full bg-red-600 text-white py-4 rounded-2xl font-black text-[15px]"; }
  else{ s.innerText=T[currentLang].clean; s.className="mt-3 text-[13px] font-black p-3 rounded-xl bg-green-200 text-black border-2 border-green-700 text-center leading-6"; b.innerText=T[currentLang].safe; b.className="w-full bg-black text-white py-4 rounded-2xl font-black text-[15px]"; }
}
function checkSAMA(pos){
  let lat=pos.coords.latitude, lon=pos.coords.longitude, acc=pos.coords.accuracy, alt=pos.coords.altitude;
  let inSaudi=lat>16&&lat<32&&lon>34&&lon<56, isMock=false;
  if((alt===0||alt===null)&&acc<100) isMock=true; if(acc<=3) isMock=true;
  render({lat,lon,acc,alt,isMock,inSaudi,isBlocked:isMock||!inSaudi});
}
function verify(){ let otp=document.getElementById('otp').value; alert(otp.length==6?"✅ Verified":"Enter 6-digit OTP"); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
navigator.geolocation.watchPosition(checkSAMA, null, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
setLang('ar');
</script>
</body>
</html>
