<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAB Secure - SAMA Compliant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/484/484167.png">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex items-center justify-center p-4">

<div class="bg-white text-gray-900 rounded-3xl shadow-2xl w-full max-w-md p-6">
  <!-- Language Switch -->
  <div class="flex justify-end gap-2 mb-2">
    <button id="btnEn" onclick="setLang('en')" class="text-xs px-3 py-1 rounded-full bg-[#0f172a] text-white font-bold">EN</button>
    <button id="btnAr" onclick="setLang('ar')" class="text-xs px-3 py-1 rounded-full bg-gray-200 text-gray-600 font-bold">العربية</button>
  </div>

  <!-- Logo -->
  <div class="text-center mb-6">
    <img src="https://cdn-icons-png.flaticon.com/512/484/484167.png" class="w-16 h-16 mx-auto mb-3">
    <h1 id="title" class="text-2xl font-bold text-[#0f172a]">SAB Secure</h1>
    <p id="subTitle" class="text-sm text-gray-500">SAMA Compliant Location Verification</p>
    <span class="inline-block mt-2 bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full">● PWA Active - Install Ready</span>
  </div>

  <!-- SAMA Card -->
  <div class="space-y-4">
    <div class="bg-gray-50 p-4 rounded-xl">
      <div class="flex justify-between items-center">
        <label id="locLabel" class="text-xs font-bold text-gray-500">USER LOCATION</label>
        <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold">● LIVE AUTO</span>
      </div>
      <p id="location" class="font-mono text-sm mt-1">Fetching GPS...</p>
      <p id="accText" class="font-mono text-[11px] text-gray-500 mt-1"></p>
      <p id="status" class="text-xs mt-2 text-blue-600 font-bold">Checking SAMA Geofence...</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-xl">
      <label class="text-xs font-bold text-gray-500">VERIFICATION</label>
      <div class="flex gap-2 mt-2">
        <input id="otp" type="text" placeholder="Enter OTP" class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none">
        <button onclick="verify()" class="bg-[#0f172a] text-white px-5 py-2 rounded-lg text-sm font-bold">Verify</button>
      </div>
    </div>

    <button id="mainBtn" onclick="getLocation()" class="w-full bg-[#0f172a] text-white py-3 rounded-xl font-bold">📍 Verify My Location (SAMA)</button>
    <p id="samaTxt" class="text-[10px] text-center text-gray-400">Complies with SAMA CSF & NCA ECC-1:2018<br>Data stays inside KSA - No external API - Fake GPS Detection Active</p>
  </div>
</div>

<script>
let currentLang='en';
let lastLat=null, lastLon=null;

const T={
 en:{
  title:"SAB Secure", sub:"SAMA Compliant Location Verification",
  loc:"USER LOCATION", safe:"📍 Verify My Location (SAMA)", block:"🚫 Blocked - Fake Detected",
  fetching:"Fetching GPS...", checking:"Checking SAMA Geofence...",
  clean:"✅ Inside KSA - SAMA Compliant - Risk 100 - Clean Location",
  mock:"⚠️ Mock/Fake Location Detected - Risk 960 - BLOCKED - SAMA Alert",
  safeFollow:"✅ Safe follow-up - All Allowed",
  unsafe:"🚫 Block & Report to SAMA - Risk 960",
  sama:"Complies with SAMA CSF & NCA ECC-1:2018<br>Data stays inside KSA - No external API - Fake GPS Detection Active",
  otpOk:"✅ Verified - SAMA Log Saved - Risk 100", otpErr:"Enter 6-digit OTP",
  acc:"Accuracy"
 },
 ar:{
  title:"SAB - البنك السعودي الأول", sub:"التحقق من الموقع متوافق مع SAMA",
  loc:"موقع المستخدم", safe:"📍 التحقق من موقعي (SAMA)", block:"🚫 محظور - تم اكتشاف تزييف",
  fetching:"جاري جلب GPS...", checking:"جاري التحقق من سياج SAMA...",
  clean:"✅ داخل المملكة - متوافق مع SAMA - مستوى الخطر 100 - موقع نظيف",
  mock:"⚠️ تم اكتشاف موقع وهمي - مستوى الخطر 960 - محظور - تنبيه SAMA",
  safeFollow:"✅ متابعة آمنة - مسموح",
  unsafe:"🚫 حظر وإبلاغ SAMA - خطر 960",
  sama:"متوافق مع SAMA CSF و NCA ECC-1:2018<br>البيانات داخل المملكة - كشف GPS الوهمي نشط",
  otpOk:"✅ تم التحقق - تم حفظ سجل SAMA - خطر 100", otpErr:"أدخل رمز OTP المكون من 6 أرقام",
  acc:"الدقة"
 }
};

function setLang(l){
 currentLang=l;
 document.documentElement.lang=l;
 document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.getElementById('btnEn').className = l==='en'?"text-xs px-3 py-1 rounded-full bg-[#0f172a] text-white font-bold":"text-xs px-3 py-1 rounded-full bg-gray-200 text-gray-600 font-bold";
 document.getElementById('btnAr').className = l==='ar'?"text-xs px-3 py-1 rounded-full bg-[#0f172a] text-white font-bold":"text-xs px-3 py-1 rounded-full bg-gray-200 text-gray-600 font-bold";
 document.getElementById('title').innerText=T[l].title;
 document.getElementById('subTitle').innerText=T[l].sub;
 document.getElementById('locLabel').innerText=T[l].loc;
 document.getElementById('samaTxt').innerHTML=T[l].sama;
 if(window.lastData) render(window.lastData);
}

function render(data){
 window.lastData=data;
 const locEl=document.getElementById('location');
 const statusEl=document.getElementById('status');
 const btn=document.getElementById('mainBtn');
 const accEl=document.getElementById('accText');
 locEl.innerText=data.lat.toFixed(6)+", "+data.lon.toFixed(6);
 accEl.innerText=T[currentLang].acc+": "+Math.round(data.acc)+"m - Alt: "+(data.alt===null?"null":data.alt);
 if(data.isBlocked){
  statusEl.innerText=data.isMock?T[currentLang].mock:"❌ Outside KSA - Blocked per SAMA";
  statusEl.className="text-xs mt-2 text-red-600 font-bold";
  btn.innerText=T[currentLang].unsafe;
  btn.className="w-full bg-red-700 text-white py-3 rounded-xl font-bold";
 } else {
  statusEl.innerText=T[currentLang].clean;
  statusEl.className="text-xs mt-2 text-green-600 font-bold";
  btn.innerText=T[currentLang].safeFollow;
  btn.className="w-full bg-[#0f172a] text-white py-3 rounded-xl font-bold";
 }
}

function getLocation(){
 const locEl=document.getElementById('location');
 const statusEl=document.getElementById('status');
 locEl.innerText=T[currentLang].fetching;
 statusEl.innerText=T[currentLang].checking;
 if(!navigator.geolocation){ locEl.innerText="Geolocation not supported"; return; }
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude, lon=pos.coords.longitude;
  let acc=pos.coords.accuracy, alt=pos.coords.altitude;
  let inSaudi = lat>16 && lat<32 && lon>34 && lon<56;
  let isMock=false;

  // --- MERGED SAMA FAKE DETECTION ---
  if((alt===0 || alt===null) && acc<100) isMock=true; // Riyadh height 600m, fake gives 0
  if(Number.isInteger(acc) && acc<30) isMock=true; // Real GPS 20.34, Fake 20
  if(acc<=5) isMock=true; // Too perfect
  if(lastLat!==null){
    let dLat=Math.abs(lat-lastLat), dLon=Math.abs(lon-lastLon);
    if(dLat>0.01 || dLon>0.01) isMock=true; // Teleport 1km
  }
  lastLat=lat; lastLon=lon;
  let isBlocked = isMock ||!inSaudi;
  render({lat,lon,acc,alt,isMock,inSaudi,isBlocked});
 }, err=>{
  locEl.innerText="Location Error: Enable GPS";
 }, {enableHighAccuracy:true, maximumAge:0, timeout:10000});
}

function verify(){
 const otp=document.getElementById('otp').value;
 if(otp.length==6){ alert(T[currentLang].otpOk); }
 else { alert(T[currentLang].otpErr); }
}

getLocation();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
